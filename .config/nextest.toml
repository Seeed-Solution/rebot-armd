# cargo-nextest configuration (https://nexte.st). Install: `cargo install cargo-nextest --locked`.
#
#   cargo nextest run --workspace                  # every test, one process per test
#   cargo nextest run --workspace --profile quick  # iteration: excludes slow motion/vision/replay integration suites
#   cargo nextest run --workspace --profile fast   # day-to-day: without the slow motion/vision binaries
#   cargo nextest run --workspace --profile ci     # full suite before a merge (and `cargo test --workspace` once)
#
# Each test runs in its own process, so tests of one binary do not share statics or env vars.

[profile.default]
test-threads = "num-cpus"
retries = 0
fail-fast = false
# report a test as SLOW after 30 s, kill it after 6 periods (3 min)
slow-timeout = { period = "30s", terminate-after = 6 }
# list the slow, failed and retried tests again after the run
final-status-level = "slow"

[profile.ci]
# a real failure is not retried away; only the load-sensitive group (below) gets one retry
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
final-status-level = "slow"
junit = { path = "junit.xml" }

# Fast iteration lane: excludes the slow motion/vision/replay integration tests and warns
# early on slow tests (10 s). Keep `ci` (or default) for full verification before merging.
[profile.quick]
default-filter = """
not (binary(test_mview_gray_bundle) | binary(test_ws_replay) | binary(test_move_path_joint)
     | binary(test_place) | binary(test_grasp) | binary(test_replay) | binary(test_poses)
     | binary(test_yaw_outward) | binary(test_teach_sequences) | binary(test_measure_multiview)
     | binary(test_mview_stereo) | binary(test_calib_hover)
     | test(=test_5dof_place_execution_lateral_target))
"""
retries = 0
fail-fast = true
slow-timeout = { period = "10s", terminate-after = 6 }
final-status-level = "slow"

# Day-to-day lane: leaves out the test binaries that drive simulated motions or the multi-view
# measurement in real time (over 85 % of the test time, spark 2026-11-23). Run them with the
# default profile when a change touches grasp, place, measurement, calibration hover or motion
# planning, and always before a merge.
[profile.fast]
default-filter = """
not (binary(test_grasp) | binary(test_measure_multiview) | binary(test_mview_stereo)
     | binary(test_mview_gray_bundle) | binary(test_move_path_joint) | binary(test_place)
     | binary(test_calib_hover) | binary(test_yaw_outward) | binary(test_teach_sequences)
     | binary(test_poses))
"""
retries = 0
fail-fast = true
slow-timeout = { period = "15s", terminate-after = 12 }

[test-groups]
# Tests that check wall-clock rates or deadlines: one at a time, so they compete with fewer
# test processes for the CPU.
timing = { max-threads = 1 }
# Tests that reserve a free port, release it and start the armd binary on it.
armd-process = { max-threads = 1 }

[[profile.default.overrides]]
filter = """
binary(test_damiao_smoothness) | binary(test_obs_rate) | binary(test_kincal_timing)
| binary(test_alloc_timing)
| (binary(test_rt_m_motion) & (test(=legacy_home_and_jog_write_lock_hold_under_2ms_with_no_in_lock_fallback) | test(=m2_off_thread_watchdog_park_bare_quintic_refusal_mit_handback_and_zero_alloc)))
| (binary(test_rt_s_servo) & test(=b2_m1_executor_large_workspace_32_endpoints_keepout_refusal_and_config_commit_zero_alloc))
"""
test-group = "timing"

[[profile.default.overrides]]
filter = "binary(test_startup_shutdown) | binary(test_arm_profile)"
test-group = "armd-process"

[[profile.ci.overrides]]
filter = """
binary(test_damiao_smoothness) | binary(test_obs_rate) | binary(test_kincal_timing)
| binary(test_alloc_timing)
| (binary(test_rt_m_motion) & (test(=legacy_home_and_jog_write_lock_hold_under_2ms_with_no_in_lock_fallback) | test(=m2_off_thread_watchdog_park_bare_quintic_refusal_mit_handback_and_zero_alloc)))
| (binary(test_rt_s_servo) & test(=b2_m1_executor_large_workspace_32_endpoints_keepout_refusal_and_config_commit_zero_alloc))
"""
test-group = "timing"
retries = 1

[[profile.ci.overrides]]
filter = "binary(test_startup_shutdown) | binary(test_arm_profile)"
test-group = "armd-process"
