# Cross-compile settings for the reCamera (SG2002, RISC-V T-Head C906).
# Host builds (`cargo build`, `cargo test`) do not use this section.
#
# Linking also needs the T-Head musl libraries from the SG2002 toolchain
# (sophgo host-tools, riscv64-linux-musl-x86_64). scripts/build_deb.sh adds
# their -L paths from RECAMERA_TOOLCHAIN; see the README, "Cross-compile".
# Note: a RUSTFLAGS environment variable replaces this list.
[target.riscv64gc-unknown-linux-musl]
rustflags = [
    "-C", "linker=rust-lld",
    "-C", "target-feature=+crt-static",
]

# Host builds on aarch64 Linux (tests, clippy build scripts, cargo run) link with rust-lld through
# scripts/host-linker-lld.sh; GNU ld spends ~80% of a test binary's build in the linker.
# Set CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=cc to link with the system linker again.
[target.aarch64-unknown-linux-gnu]
linker = "scripts/host-linker-lld.sh"
