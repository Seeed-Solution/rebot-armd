[package]
name = "armd"
version = "0.1.0"
edition = "2021"
description = "Arm control daemon (armd) for the reBot B601-DM arm on a Seeed reCamera: lease-based WebSocket control, safety supervisor, web cockpit and Parquet episode recording"
license = "MIT"
repository = "https://github.com/Seeed-Solution/rebot-armd"
homepage = "https://github.com/Seeed-Solution/rebot-armd"
readme = "README.md"
keywords = ["robotics", "robot-arm", "lerobot", "recamera", "can"]
categories = ["science::robotics"]
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "json", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tempfile = "3"
serialport = { version = "4", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
libc = "0.2"

# Style lints that the code base does not follow; everything else is denied in CI
# (`cargo clippy --all-targets -- -D warnings`).
[lints.clippy]
# index loops where several per-joint arrays share the index
needless_range_loop = "allow"
# tests build an ArmConfig from Default and then set the fields under test
field_reassign_with_default = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[dev-dependencies]
tokio-tungstenite = "0.29"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "4", default-features = false }
libc = "0.2"
