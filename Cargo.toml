[package]
name = "armd"
version = "0.1.0"
edition = "2021"
description = "Arm control daemon (armd) for the reBot B601-DM arm on a Seeed reCamera: lease-based WebSocket control, safety supervisor, web cockpit and Parquet episode recording"
license = "MIT"
repository = "https://github.com/Seeed-Solution/rebot-armd"
homepage = "https://github.com/Seeed-Solution/rebot-armd"
readme = "README.md"
keywords = ["robotics", "robot-arm", "lerobot", "recamera", "can"]
categories = ["science::robotics"]
publish = false

[features]
# The device build carries the policy runtime with both backends (RMLP and tract ONNX);
# the package manifest picks the backend. `--no-default-features` builds armd without it.
default = ["policy-tract"]
policy-runtime = []
policy-tract = ["policy-runtime", "dep:tract-onnx"]
# host / riscv replay of measure_multiview debug bundles (src/bin/mview_replay.rs); not in the
# device package (scripts/build_deb.sh builds the default features)
mview-replay = []

[[bin]]
name = "mview-replay"
path = "src/bin/mview_replay.rs"
required-features = ["mview-replay"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
roxmltree = "0.21"

# armd.wasm (MJCF composition, used by rebot-companion's bundle_export):
#   cargo rustc --lib --release --target wasm32-unknown-unknown --crate-type cdylib
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mview-stereo = { path = "crates/mview-stereo" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "json", "http1", "multipart"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
serialport = { version = "4", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
libc = "0.2"
tract-onnx = { version = "0.21", default-features = false, optional = true }
# camera snapshots of the multi-view measurement (src/measure_multiview.rs); pure Rust, no SIMD
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

# Style lints that the code base does not follow; everything else is denied in CI
# (`cargo clippy --all-targets -- -D warnings`).
[lints.clippy]
# index loops where several per-joint arrays share the index
needless_range_loop = "allow"
# tests build an ArmConfig from Default and then set the fields under test
field_reassign_with_default = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-tungstenite = "0.29"
reqwest = { version = "0.12", features = ["json"] }
jpeg-encoder = "0.6"

[workspace]
members = ["crates/mview-stereo"]
default-members = [".", "crates/mview-stereo"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

# The policy runtime's numeric kernels are optimised for speed; the rest of armd stays size-optimised.
# Measured on the SG2002 (2026-11-21): the 1.98 M-parameter MLP takes 47.5 ms per step in armd with tract at
# opt-level "z" and 13.8 ms at opt-level 3 (binary 12.8 -> 16.0 MB).
[profile.release.package.tract-core]
opt-level = 3
[profile.release.package.tract-data]
opt-level = 3
[profile.release.package.tract-hir]
opt-level = 3
[profile.release.package.tract-linalg]
opt-level = 3
[profile.release.package.tract-nnef]
opt-level = 3
[profile.release.package.tract-onnx]
opt-level = 3
[profile.release.package.tract-onnx-opl]
opt-level = 3
[profile.release.package.ndarray]
opt-level = 3
[profile.release.package.matrixmultiply]
opt-level = 3

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "4", default-features = false }
libc = "0.2"

# The multi-view measurement's image matching (crates/mview-stereo) at opt-level 3: armd itself at
# opt-level 3 is 34.5 MB instead of 16.4 MB (riscv64, 2026-11-22); this crate alone adds little.
[profile.release.package.mview-stereo]
opt-level = 3
