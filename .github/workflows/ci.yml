name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # cargo fmt --check is not run: the code base is not rustfmt-formatted yet.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  web:
    # Self-tests of the web cockpit (src/api/index.html), run in Node without a browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: View-frame IK self-test
        run: node scripts/view_ik_selftest.mjs
      - name: Hand-eye calibration self-test
        # part c (rebot-companion round-trip) is skipped when ../rebot-companion is absent
        run: node scripts/calib_selftest.mjs
      - name: RPC error contract
        run: node tests/test_rpc_error_contract.js

  kits:
    # Shell syntax of the kit init scripts (the deb itself needs the SG2002 toolchain).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init script syntax
        run: |
          for f in kits/recamera-b601dm/packaging/rootfs/etc/init.d/* \
                   kits/_template/packaging/etc/init.d/*; do
            sh -n "$f" && echo "ok $f"
          done
      - name: Build script syntax
        run: bash -n scripts/build_deb.sh
