name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the toolchain the local gates run; a floating "stable" picked up new clippy
      # lints (Rust 1.100, chunks_exact_to_as_chunks) and failed the v1.6.0 push.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # cargo fmt --check is not run: the code base is not rustfmt-formatted yet.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  web:
    # Self-tests of the web cockpit (src/api/index.html), run in Node without a browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: View-frame IK self-test
        run: node scripts/view_ik_selftest.mjs
      - name: Hand-eye calibration self-test
        # part c (rebot-companion round-trip) is skipped when ../rebot-companion is absent
        run: node scripts/calib_selftest.mjs
      - name: Calibration wizard self-test
        run: node scripts/calib_wizard_selftest.mjs
      - name: RPC error contract
        run: node tests/test_rpc_error_contract.js
      - name: MIT recovery confirmation (cockpit)
        run: node tests/test_mit_recovery_confirm.js

  kits:
    # Shell syntax of the kit init scripts (the deb itself needs the SG2002 toolchain).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init script syntax
        run: |
          for f in kits/recamera-b601dm/packaging/rootfs/etc/init.d/* \
                   kits/recamera-b601dm/packaging/rootfs/usr/share/rebot-teleop/rebot-vision-run \
                   kits/recamera-b601dm/packaging/debian/postinst \
                   kits/recamera-b601dm/packaging/debian/prerm \
                   kits/_template/packaging/etc/init.d/*; do
            sh -n "$f" && echo "ok $f"
          done
      - name: Build script syntax
        run: bash -n scripts/build_deb.sh && bash -n scripts/build_vision.sh && bash -n scripts/source_paths.sh
      - name: build_vision.sh publication tests
        run: bash scripts/tests/build_vision_publish_test.sh

  tooling:
    # File-level source line limit ratchet (>3000 block, 1501..=3000 warn) and split-tooling tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Source limits ratchet
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_source_limits
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check_source_limits --base "${{ github.event.before }}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            python3 scripts/check_source_limits --base HEAD~1
          else
            python3 scripts/check_source_limits --base HEAD
          fi
      - name: Tooling self-tests
        run: |
          python3 scripts/tests/check_source_limits_test.py -v
          python3 scripts/tests/check_move_only_test.py -v
          bash scripts/tests/source_paths_test.sh

  vision-host-tests:
    # Portable parts of rebot-vision (kits/recamera-b601dm/vision/tests), no SG2002 SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nlohmann-json
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - name: Build and run
        run: |
          cmake -S kits/recamera-b601dm/vision/tests -B build/vision-tests
          cmake --build build/vision-tests -j
          ctest --test-dir build/vision-tests --output-on-failure
