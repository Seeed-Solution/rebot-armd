[project]
name = "rebot-sim"
version = "0.1.0"
description = "MuJoCo physics simulator for armd --follower sim (reBot B601-DM)"
authors = [
    { name = "Harvest Su", email = "suharvest@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "av>=19.0.2",
    "matplotlib>=3.11.2",
    "mujoco>=4.0.0",
    "numpy>=2.5.4",
    "websockets>=17.4",
]

[project.scripts]
rebot-sim = "rebot_sim.server:main"
rebot-sim-fk = "rebot_sim.fk:main"
rebot-sysid = "rebot_sim.sysid:cli"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs of a minute or more"]
# websockets 17 warns when a sync connection outlives a `with` block; the e2e client
# keeps one open across the test on purpose.
filterwarnings = ["ignore:connect\\(\\) must be used as a context manager:DeprecationWarning"]
